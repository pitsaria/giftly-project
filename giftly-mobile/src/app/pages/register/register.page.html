<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/home" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>Sign Up</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="brand">
    <img src="assets/giftly/giftly-logo.png" alt="Giftly" />
    <p>Create an account to start shopping.</p>
  </div>

  <div class="field-row">
    <ion-input label="First Name" labelPlacement="stacked" fill="outline" [(ngModel)]="firstname" class="field"></ion-input>
    <ion-input label="Last Name" labelPlacement="stacked" fill="outline" [(ngModel)]="lastname" class="field"></ion-input>
  </div>

  <ion-input
    type="email"
    label="Email"
    labelPlacement="stacked"
    fill="outline"
    [(ngModel)]="email"
    (ionBlur)="emailTouched = true"
    class="field"
  ></ion-input>
  <div class="field-error" *ngIf="emailTouched && !emailValid">Please enter a valid email address.</div>

  <app-ph-phone-input
    label="Phone"
    class="field"
    [(digits)]="phoneDigits"
    [(touched)]="phoneTouched"
  ></app-ph-phone-input>

  <app-password-strength-input
    label="Password"
    class="field"
    [(value)]="password"
    (validChange)="passwordValid = $event"
  ></app-password-strength-input>

  <ion-input
    type="password"
    label="Confirm Password"
    labelPlacement="stacked"
    fill="outline"
    [(ngModel)]="confirmPassword"
    class="field"
  >
    <ion-input-password-toggle slot="end"></ion-input-password-toggle>
  </ion-input>
  <div class="field-error" *ngIf="confirmMismatch">Passwords do not match.</div>

  <ion-button expand="block" class="giftly-btn-primary" [disabled]="submitting()" (click)="register()">
    {{ submitting() ? 'Creating account...' : 'Sign Up' }}
  </ion-button>

  <p class="switch-link">
    Already have an account? <a routerLink="/login">Login</a>
  </p>
</ion-content>
