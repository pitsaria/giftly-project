<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/home" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>Notifications</ion-title>
    <ion-buttons slot="end" *ngIf="hasUnread()">
      <ion-button fill="clear" size="small" class="mark-all-btn" (click)="markAllRead()">Mark all read</ion-button>
    </ion-buttons>
  </ion-toolbar>
  <ion-segment [value]="tab()" (ionChange)="switchTab($event.detail.value)" scrollable>
    <ion-segment-button value="all">
      <ion-label>All</ion-label>
    </ion-segment-button>
    <ion-segment-button value="order">
      <ion-label>Orders</ion-label>
    </ion-segment-button>
    <ion-segment-button value="promo">
      <ion-label>Promos</ion-label>
    </ion-segment-button>
    <ion-segment-button value="product">
      <ion-label>Products</ion-label>
    </ion-segment-button>
  </ion-segment>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div class="ion-text-center loading-spinner" *ngIf="loading()">
    <ion-spinner name="crescent"></ion-spinner>
  </div>

  <div class="empty-state error" *ngIf="!loading() && error()">
    <ion-icon name="notifications-off-outline"></ion-icon>
    <p>{{ error() }}</p>
    <ion-button fill="outline" size="small" (click)="reload()">Try again</ion-button>
  </div>

  <div class="empty-state" *ngIf="!loading() && !error() && !items().length">
    <ion-icon name="notifications-off-outline"></ion-icon>
    <p>No notifications here yet.</p>
  </div>

  <div class="notif-list" *ngIf="!loading() && items().length">
    <ng-container *ngFor="let group of groups()">
      <div class="group-label">{{ group.label }}</div>

      <div
        class="notif-item"
        *ngFor="let item of group.items"
        [class.unread]="!item.is_read"
        (click)="onItemTap(item)"
      >
        <div class="notif-icon" [class]="item.category">
          <ion-icon [name]="iconFor(item.category)"></ion-icon>
        </div>
        <div class="notif-text">
          <div class="notif-title">{{ item.title }}</div>
          <div class="notif-body">{{ item.body }}</div>
          <div class="notif-time">{{ timeAgo(item.created_at) }}</div>
        </div>
        <span class="unread-dot" *ngIf="!item.is_read"></span>
      </div>
    </ng-container>

    <ion-button
      *ngIf="hasMore()"
      expand="block"
      fill="outline"
      class="load-more-btn"
      [disabled]="loadingMore()"
      (click)="loadMore()"
    >
      {{ loadingMore() ? 'Loading…' : 'Load more' }}
    </ion-button>
  </div>
</ion-content>
