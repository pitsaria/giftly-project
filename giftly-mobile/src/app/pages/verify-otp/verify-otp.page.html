<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/login" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>Verify sign-in</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="brand">
    <img src="assets/giftly/giftly-logo.png" alt="Giftly" />
    <p>We emailed a 6-digit code to <strong>{{ emailMasked }}</strong>. Enter it below to finish signing in.</p>
  </div>

  <ion-input
    type="tel"
    inputmode="numeric"
    maxlength="6"
    label="6-digit code"
    labelPlacement="stacked"
    fill="outline"
    placeholder="123456"
    [(ngModel)]="code"
    class="field code-field"
  ></ion-input>

  <ion-button expand="block" class="giftly-btn-primary" [disabled]="submitting()" (click)="verify()">
    {{ submitting() ? 'Verifying...' : 'Verify & sign in' }}
  </ion-button>

  <ion-button expand="block" fill="clear" [disabled]="cooldown() > 0" (click)="resend()">
    {{ cooldown() > 0 ? 'Resend code in ' + cooldown() + 's' : 'Resend code' }}
  </ion-button>

  <p class="switch-link">
    Not you? <a routerLink="/login">Use a different account</a>
  </p>
</ion-content>
