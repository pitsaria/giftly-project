<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/login" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>Forgot Password</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="brand">
    <img src="assets/giftly/giftly-logo.png" alt="Giftly" />
    <p>Enter your account email and we'll send you a 6-digit code.</p>
  </div>

  <ion-input
    type="email"
    label="Email"
    labelPlacement="stacked"
    fill="outline"
    [(ngModel)]="email"
    class="field"
  ></ion-input>

  <ion-button expand="block" class="giftly-btn-primary" [disabled]="submitting()" (click)="submit()">
    {{ submitting() ? 'Sending code...' : 'Send Code' }}
  </ion-button>

  <p class="switch-link">
    Remembered your password? <a routerLink="/login">Login</a>
  </p>
</ion-content>
