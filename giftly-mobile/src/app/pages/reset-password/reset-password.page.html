<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/login" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>Reset Password</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="brand">
    <img src="assets/giftly/giftly-logo.png" alt="Giftly" />
    <p>Enter your reset code and choose a new password.</p>
  </div>

  <ion-input
    label="Reset Code"
    labelPlacement="stacked"
    fill="outline"
    [(ngModel)]="token"
    class="field"
  ></ion-input>

  <app-password-strength-input
    label="New Password"
    class="field"
    [(value)]="password"
    (validChange)="passwordValid = $event"
  ></app-password-strength-input>

  <ion-input
    type="password"
    label="Confirm New Password"
    labelPlacement="stacked"
    fill="outline"
    [(ngModel)]="confirmPassword"
    class="field"
  >
    <ion-input-password-toggle slot="end"></ion-input-password-toggle>
  </ion-input>
  <div class="field-error" *ngIf="confirmMismatch">Passwords do not match.</div>

  <ion-button expand="block" class="giftly-btn-primary" [disabled]="submitting()" (click)="submit()">
    {{ submitting() ? 'Resetting...' : 'Reset Password' }}
  </ion-button>

  <p class="switch-link">
    Remembered your password? <a routerLink="/login">Login</a>
  </p>
</ion-content>
