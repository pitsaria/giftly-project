<ion-content class="ion-padding">
  <div class="product-image-wrap">
    <button class="close-btn" (click)="dismiss()" aria-label="Close">
      <ion-icon name="close-outline"></ion-icon>
    </button>
    <img [src]="product.image | imgUrl" [alt]="product.name" class="product-image" />
    <button class="heart-btn" [class.active]="isWishlisted()" (click)="toggleWishlist()">
      <ion-icon [name]="isWishlisted() ? 'heart' : 'heart-outline'"></ion-icon>
    </button>
    <div class="out-of-stock-ribbon" *ngIf="!inStock()">Out of Stock</div>
  </div>

  <h1>{{ product.name }}</h1>
  <div class="rating-line" *ngIf="product.review_count">
    <ion-icon name="star" *ngFor="let s of ratingStars()"></ion-icon>
    <span>{{ product.avg_rating }} ({{ product.review_count }})</span>
  </div>
  <div class="price">₱{{ product.price }}</div>
  <p class="description">{{ product.description }}</p>

  <div class="quantity-row" *ngIf="inStock()">
    <span>Quantity</span>
    <div class="stepper">
      <button (click)="decrease()"><ion-icon name="remove-outline"></ion-icon></button>
      <span>{{ quantity() }}</span>
      <button (click)="increase()"><ion-icon name="add-outline"></ion-icon></button>
    </div>
  </div>

  <ion-button
    expand="block"
    class="giftly-btn-primary"
    [disabled]="!inStock() || adding()"
    (click)="addToCart()"
  >
    {{ inStock() ? 'Add to Cart' : 'Out of Stock' }}
  </ion-button>

  <app-product-reviews [productId]="product.id"></app-product-reviews>
</ion-content>
